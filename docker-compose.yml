version: "3"
services:
  postgres:
    image: postgres:15
    container_name: jubelio-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: JDB
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  users:
    build: ./services/users
    environment:
      DATABASE_URL: "postgres://postgres:postgres@postgres:5432/users"
    ports:
      - "3001:3001"
    depends_on:
      - postgres

  products:
    build: ./services/products
    environment:
      DATABASE_URL: "postgres://postgres:postgres@postgres:5432/products"
    ports:
      - "3002:3002"
    depends_on:
      - postgres

  orders:
    build: ./services/orders
    environment:
      DATABASE_URL: "postgres://postgres:postgres@postgres:5432/orders"
    ports:
      - "3003:3003"
    depends_on:
      - postgres

  payments:
    build: ./services/payments
    environment:
      DATABASE_URL: "postgres://postgres:postgres@postgres:5432/payments"
    ports:
      - "3004:3004"
    depends_on:
      - postgres

  invitations:
    build: ./services/invitations
    environment:
      DATABASE_URL: "postgres://postgres:postgres@postgres:5432/invitations"
    ports:
      - "3005:3005"
    depends_on:
      - postgres

volumes:
  postgres_data:
