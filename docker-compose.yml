version: "3"
services:
  postgres:
    image: postgres:15
    container_name: jubelio-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: jdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  users:
    build: ./services/users
    environment:
      - DB_HOST=localhost
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=jdb
      - JWT_SECRET=secret
    ports:
      - "3001:3001"
    depends_on:
      - postgres

